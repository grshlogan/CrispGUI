{
  "comment": "日语通用/杂谈/翻唱/ASMR: CKHO cohere-asr-ja Q8_0 (移植自 efwkjn/cohere-asr-ja)。本配置由根目录 ja_Cohere-JA.conf 迁移 (2026-10-11), 模型与对齐器路径更新为 Japanese 子目录。Cohere 的'原生'词级时间戳按空格切分, 对日语无效, 必须配 ja 对齐器 + force_aligner。",

  // 用哪套可执行文件。
  //   cuda13 = CUDA 13 构建 (首选)
  //   vulkan = Vulkan 构建 (备用)
  "build": "cuda13",

  // 后端名, 与模型架构绑定, 不要改。
  "backend": "cohere",

  // 模型文件 (相对 models\ 目录, 支持子目录; JSON 中反斜杠写作 \\ )。
  "model": "Japanese\\[CKHO]cohere-asr-ja-GGUF\\cohere-asr-ja-q8_0.gguf",

  // 模型缺失时菜单会提示的下载地址 (人工下载后放入对应子目录)。
  "download": "https://huggingface.co/CKHO/cohere-asr-ja-GGUF/resolve/main/cohere-asr-ja-q8_0.gguf",

  // 监听地址。127.0.0.1 = 仅本机可访问 (安全默认)。
  "host": "127.0.0.1",

  // 服务端口。5114 = 2026-10-10 起 CrispASR 全项目统一端口 (原 8080 已废弃)。
  "port": 5114,

  // GPU 选择 (CUDA_VISIBLE_DEVICES)。"1" = RTX 3080。
  "device": "1",

  // 覆盖默认 API key (默认值在 scripts\start-crispasr.ps1 里 = "default")。
  "api_keys": "",

  // 语种。"ja" = 钉死日语: 避免 LID 误判 + 省一次检测开销。
  "language": "ja",

  // 日语专用 CTC 对齐器 (WhisperX 同款声学对齐), 供词级时间戳。
  // 注意: 2026-10-11 已从根目录 q4_k 更换为 Japanese 子目录 q8_0 版。
  "aligner": "Japanese\\[cstr]wav2vec2-large-xlsr-53-japanese-GGUF\\wav2vec2-large-xlsr-53-japanese-q8_0.gguf",

  // 必须 true: 否则运行时检测到 cohere "已有原生词级" 会跳过对齐器。
  "force_aligner": true,

  // Silero VAD (885KB, 已缓存于 cache\): 按语音停顿切段、跳过静音、防静音段幻觉。
  "vad": true,

  // 无 VAD 时的分块秒数 (VAD 开启时仅作兜底)。模型训练音频 0~35s, 30 贴合。
  "chunk_seconds": 30,

  // ======================= 解码参数 =======================

  // 波束搜索宽度 (-bs N)。日常保持 1; 动画/游戏/嘈杂素材可试 5。
  "beam_size": 1,

  // 采样温度 (-tp F)。0 = 纯贪心, 逐位可复现。ASR 场景保持 0。
  "temperature": 0,

  // 频率惩罚。0 = 关; 日语有大量合法重复, 谨慎使用。
  "frequency_penalty": 0,

  // 单段最大生成 token 数 (-n N)。解码器 KV 上限 max_ctx=1024, 不要超过 ~700。
  "max_new_tokens": 512,

  // 采样随机种子。仅 temperature > 0 时有意义。
  "seed": 0,

  // ======================= 输出 =======================

  // 关闭标点。cohere 的标点是模型原生能力。保持 false (要标点)。
  "no_punctuation": false,

  // 按句末标点拆字幕行。VideoCaptioner 自带 LLM 断句, 保持 false 避免双重断句。
  "split_on_punct": false,

  // ======================= 其它透传 CLI 参数 =======================
  "args": [
    "--vad-threshold", "0.3"
  ]

  // ======================= 不适用参数 (勿试) =======================
  //   prompt / hotwords      → cohere 不在热词/提示注入支持列表
  //   best_of                → whisper 专属
  //   top_p                  → 服务器无此字段
  //   translate/-sl/-tl      → 该日语精调模型仅转写
}
