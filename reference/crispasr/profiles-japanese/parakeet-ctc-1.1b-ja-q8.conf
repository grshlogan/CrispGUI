{
  "comment": "日语高速/吞吐优先: parakeet-ctc-1.1b-ja Q8_0 GGUF (cstr 转换, 修复上游 Encoder NaN 的 GAL 检查点)。FastConformer-CTC 非自回归架构, 贪心解码, 速度极快; 代价是无标点输出、单窗口 >15s 时间轴漂移 (VAD 强制)。",

  // 用哪套可执行文件。cuda13 = CUDA 13 构建 (首选)。
  "build": "cuda13",

  // 后端名: fastconformer-ctc (由 GGUF 架构标签自动识别; 也可显式指定)。
  //   ⚠️ 千万不要写 "parakeet": 那是 RNN-T/TDNN 转译器运行时, 会报
  //   "required tensor 'decoder.embed.weight' not found" 拒绝加载本模型。
  "backend": "fastconformer-ctc",

  // 模型文件 (相对 models\ 目录, 支持子目录)。
  "model": "Japanese\\[cstr]parakeet-ctc-1.1b-ja-GGUF\\parakeet-ctc-1.1b-ja-q8_0.gguf",

  // 模型缺失时菜单会提示的下载地址。
  "download": "https://huggingface.co/cstr/parakeet-ctc-1.1b-ja-GGUF/resolve/main/parakeet-ctc-1.1b-ja-q8_0.gguf",

  // 监听地址。127.0.0.1 = 仅本机可访问 (安全默认)。
  "host": "127.0.0.1",

  // 服务端口。5114 = CrispASR 全项目统一端口 (2026-10-10 起)。
  "port": 5114,

  // GPU 选择 (CUDA_VISIBLE_DEVICES)。"1" = RTX 3080。
  "device": "1",

  // 覆盖默认 API key (脚本默认 = "default")。
  "api_keys": "",

  // 语种。钉死日语 (模型仅日语)。
  "language": "ja",

  // 对齐器: 实测必需！(2026-10-11) CTC 仅提供 token 级时间戳, -ojf 输出无
  //   words 字段; 挂 wav2vec2 日语对齐器后 0→46 词。对齐器与后端无关。
  "aligner": "Japanese\\[cstr]wav2vec2-large-xlsr-53-japanese-GGUF\\wav2vec2-large-xlsr-53-japanese-q8_0.gguf",

  // 强制使用对齐器词级时间戳。
  "force_aligner": true,

  // Silero VAD: 【强制】CTC 单窗口 >15s 会时间轴漂移 (cstr 明确要求), 必开。
  "vad": true,

  // 无 VAD 时的分块秒数。取 15 与漂移安全窗口一致。
  "chunk_seconds": 15,

  // ======================= 解码参数 =======================
  // ⚠️ CTC 架构不支持 temperature / beam_size / best_of / grammar
  //    (--list-backends 表格中均为 '-') — 写了也会被忽略, 不要尝试调优。

  // 频率惩罚。0 = 关 (CTC 无自回归解码, 无复读问题)。
  "frequency_penalty": 0,

  // 采样随机种子。CTC 贪心解码天然确定性, 无意义, 保持 0。
  "seed": 0,

  // ======================= 分块拼接 (CTC 特有) =======================
  // 跨块边界的子词 LCS 去重: auto (默认) = 由运行时按架构自动决定。
  //   --lcs-min-length 默认值适合常规素材; 长静音素材如出现跨块重复,
  //   可在 args 加 ["--lcs-min-length", "N"] 提高 (N>=1)。

  // ======================= 输出 =======================

  // ⚠️ 本模型不输出标点 (fastconformer-ctc 后端 punctuation='-')。
  //   日语文本标点稀疏, 影响有限; 若后续需要, 可给 --punc-model 挂
  //   标点恢复模型 (fullstop / punctuate-all, 需另行手动获取权重)。
  "no_punctuation": false,

  // 按句末标点拆字幕行: 无标点输出时无意义, 保持 false。
  "split_on_punct": false,

  // ======================= 其它透传 CLI 参数 =======================
  // VAD 单段上限 15s: 与 cstr 指出的漂移安全窗口对齐 (默认无限大)。
  "args": [
    "--vad-max-speech-duration-s", "15"
  ]

  // ======================= 注意事项 =======================
  // 1. 线程: cstr 示例用 -t 8 (CPU 场景); 本机 GPU 推理时编码器在显卡上,
  //    线程影响小, 保持默认; 纯 CPU 跑时可加 ["-t", "8"]。
  // 2. 官方 (NeMo) 参考成绩: CER reazonspeech 0.152 / jsut 0.129 /
  //    common_voice 0.129 — 通用朗读类强, 无语义自纠错能力 (CTC 天性)。
  // 3. 量化: cstr 明确 CTC 对量化噪声不敏感, Q8_0 ≈ F16 质量。
}
