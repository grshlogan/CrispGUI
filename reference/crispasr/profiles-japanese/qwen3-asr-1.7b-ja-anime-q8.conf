{
  "comment": "日语/Galgame/动画领域: qwen3-asr-1.7b-ja-anime Q8_0 GGUF (cstr 转换自 jaykwok 全量微调, 375 万条 Galgame 语音)。语音-LLM 架构 (Whisper 式音频编码器 + Qwen3 LLM 解码器), 域内 CER 较基座提升 19~27%, 通用场景略退化。Q8_0 音频塔无长音频重复问题 (cstr 145s 单趟验证)。",

  // 用哪套可执行文件。cuda13 = CUDA 13 构建 (首选)。
  "build": "cuda13",

  // 后端名: qwen3 (qwen3-1.7b 是同一后端的别名, 写哪个都行)。
  //   这是 CrispASR 家族唯一的语音-LLM 后端: 持久 KV 缓存, 逐 token 解码 O(1)。
  "backend": "qwen3",

  // 模型文件 (相对 models\ 目录, 支持子目录)。
  "model": "Japanese\\[cstr]qwen3-asr-1.7b-ja-anime-GGUF\\qwen3-asr-1.7b-ja-anime-q8_0.gguf",

  // 模型缺失时菜单会提示的下载地址。
  "download": "https://huggingface.co/cstr/qwen3-asr-1.7b-ja-anime-GGUF/resolve/main/qwen3-asr-1.7b-ja-anime-q8_0.gguf",

  // 监听地址。127.0.0.1 = 仅本机可访问 (安全默认)。
  "host": "127.0.0.1",

  // 服务端口。5114 = CrispASR 全项目统一端口 (2026-10-10 起)。
  "port": 5114,

  // GPU 选择 (CUDA_VISIBLE_DEVICES)。"1" = RTX 3080。
  "device": "1",

  // 覆盖默认 API key (脚本默认 = "default")。
  "api_keys": "",

  // 语种。钉死日语: 模型支持 30+ 语言自动检测, 钉死可避免误检并省检测开销。
  "language": "ja",

  // 对齐器: LLM 解码器无词级时间戳 (ts-ctc 为 token 级), 挂 CTC 对齐器获得
  //   词级时间戳。CTC 对齐器只依赖音频+文本, 不依赖 ASR 后端, 因此
  //   复用已有的日语 wav2vec2 对齐器即可。
  "aligner": "Japanese\\[cstr]wav2vec2-large-xlsr-53-japanese-GGUF\\wav2vec2-large-xlsr-53-japanese-q8_0.gguf",

  // 强制使用对齐器词级时间戳: qwen3 后端自身的时间戳行为对日语不可靠
  //   (与 cohere 的"伪原生词级"同理), 与 ja cohere 配置保持一致策略。
  "force_aligner": true,

  // Silero VAD: 语音-LLM 同样受益于分块 (避免超长上下文), 保持开启。
  //   注: q8_0 音频塔已在 145s 单趟长音频上验证无重复退化 (cstr #218),
  //   VAD 主要为字幕场景的时间轴质量服务。
  "vad": true,

  // 无 VAD 时的分块秒数。默认 30s; LLM 有持久 KV, 分块仅影响上下文长度。
  "chunk_seconds": 30,

  // ======================= 解码参数 =======================

  // 采样温度。0 = 纯贪心 — 官方推荐, cstr 端到端验证 (26/26 token 复现)。
  //   LLM 后端温度>0 需配 seed; ASR 场景保持 0。
  "temperature": 0,

  // 波束搜索宽度。qwen3 后端支持 beam, 但语音-LLM 的 beam 会成倍占用
  //   KV 缓存且收益未验证; 保持 1 (贪心), 有需要再实验。
  "beam_size": 1,

  // 频率惩罚。0 = 关; LLM 解码器有重复退化风险, 但 q8_0 音频塔已修复
  //   主要诱因, 保持 0 (出现复读时再考虑 0.1~0.3)。
  "frequency_penalty": 0,

  // 单段最大生成 token 数。30s 日语约 100~200 token, 512 足够。
  "max_new_tokens": 512,

  // 采样随机种子。仅 temperature > 0 时有意义。
  "seed": 0,

  // ======================= 输出 =======================

  // 标点: 语音-LLM 原生输出标点 (模型自带, Galgame 语料含标点)。
  "no_punctuation": false,

  // 按句末标点拆字幕行。VideoCaptioner 自带 LLM 断句, 保持 false。
  "split_on_punct": false,

  // ======================= 其它透传 CLI 参数 =======================
  "args": []

  // ======================= 已知限制 (勿试) =======================
  // 1. 上下文注入: 官方 Qwen3-ASR 支持文本上下文提示 (hotword/context),
  //    但 CrispASR 当前仅对 vibevoice 后端开放 --context (qwen3 未接)。
  //    Galgame 专有名词一致性目前靠后处理, 不能靠提示词。
  // 2. prompt / hotwords: 同上, qwen3 后端未接入。
  // 3. 域外退化: 通用新闻/朗读 CER 略高于基座 (作者自测 ~+0.5%),
  //    通用日语请用 cohere-asr-ja 或 kotoba-whisper 配置。
}
