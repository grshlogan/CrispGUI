{
  "comment": "日语通用/会议/播客: kotoba-whisper-v2.2 Q8_0 GGML (kenrouse 转换, whisper.cpp 格式)。v2.2 = v2.0 权重 (distil-whisper 架构, 2 层解码器) + pipeline 外挂功能; GGML 内只有 ASR 本体。官方蒸馏模型对长音频较弱, 必须 VAD 且限制单段时长。",

  // 用哪套可执行文件。cuda13 = CUDA 13 构建 (首选)。
  "build": "cuda13",

  // 后端名: whisper (标准 whisper.cpp 谱系解码器)。
  "backend": "whisper",

  // 模型文件 (相对 models\ 目录, 支持子目录)。
  "model": "Japanese\\[kenrouse]kotoba-whisper-v2.2-ggml\\kotoba-whisper-v2.2-ggml-q8_0.bin",

  // 模型缺失时菜单会提示的下载地址。
  "download": "https://huggingface.co/kenrouse/kotoba-whisper-v2.2-ggml/resolve/main/kotoba-whisper-v2.2-ggml-q8_0.bin",

  // 监听地址。127.0.0.1 = 仅本机可访问 (安全默认)。
  "host": "127.0.0.1",

  // 服务端口。5114 = CrispASR 全项目统一端口 (2026-10-10 起)。
  "port": 5114,

  // GPU 选择 (CUDA_VISIBLE_DEVICES)。"1" = RTX 3080。
  "device": "1",

  // 覆盖默认 API key (脚本默认 = "default")。
  "api_keys": "",

  // 语种。钉死日语; whisper 后端词级时间戳为原生能力, 无需对齐器。
  "language": "ja",

  // 对齐器: 实测必需！(2026-10-11) distil 模型训练时移除了 DTW 时间戳用的
  //   交叉注意力头, whisper 后端的"原生词级"对它退化成 1 个伪词; 挂
  //   wav2vec2 日语对齐器后 1→18 词。对齐器与后端无关, 复用日语对齐器即可。
  "aligner": "Japanese\\[cstr]wav2vec2-large-xlsr-53-japanese-GGUF\\wav2vec2-large-xlsr-53-japanese-q8_0.gguf",

  // 强制使用对齐器词级: distil 仍声称有词级(1个伪词), 与 cohere 同理需要强制。
  "force_aligner": true,

  // Silero VAD: 蒸馏模型长音频弱, VAD 必开。
  "vad": true,

  // 无 VAD 时的分块秒数。官方 pipeline 示例 chunk_length_s=15, 取同值。
  "chunk_seconds": 15,

  // ======================= 解码参数 =======================
  // whisper 后端支持 temperature/beam/grammar 等; 以下按官方与社区共识取值。

  // 波束搜索宽度。蒸馏 2 层解码器 + beam 组合未经验证, 保持贪心 1。
  //   实验: 稳定后可试 5 (whisper.cpp 常规增益), 对比 CER 再决定。
  "beam_size": 1,

  // 采样温度。0 = 纯贪心 (官方 pipeline 默认即贪心 + 温度回退由运行时处理)。
  "temperature": 0,

  // 频率惩罚。0 = 关。
  "frequency_penalty": 0,

  // 单段最大生成 token 数。留空 = 后端默认 (whisper 按窗口长度自适应)。
  //   15s 日语约 60~150 token, 后端默认足够。
  "max_new_tokens": 0,

  // 采样随机种子。0 = 每次随机 (temperature 0 时无意义)。
  "seed": 0,

  // ======================= 输出 =======================

  // 标点: whisper 后端原生输出 (模型自带); 日语文本标点本来稀疏, 保持 false。
  "no_punctuation": false,

  // 按句末标点拆字幕行。VideoCaptioner 自带 LLM 断句, 保持 false。
  "split_on_punct": false,

  // ======================= 其它透传 CLI 参数 =======================
  // 官方蒸馏模型对长音频弱: VAD 开启时用 max-speech-duration 把单段上限
  //   压到 15s, 与官方 pipeline 的 chunk_length_s=15 对齐 (默认无限大)。
  "args": [
    "--vad-max-speech-duration-s", "15"
  ]

  // ======================= 注意事项 =======================
  // 1. distil 架构 (2 层解码器) 能否被本机 CrispASR 构建 (2026-10-02) 加载
  //    尚未实测 — 首次启动若报层结构错误, 属预期风险, 需反馈排查。
  // 2. 官方卡提到的 add_silence_start/end=0.5 技巧属于 Python pipeline,
  //    不适用于 GGML 运行时; VAD 的 pad 参数可小幅度模拟 (默认 30ms 保持)。
  // 3. 该模型说话人分离/标点恢复是 Python pipeline 功能, 不在 GGML 权重内;
  //    分离需求走 CrispASR 的 diarize 参数 (另行实验)。
  // 4. Flash Attention 已默认开启 (官方推荐 FA2, 此处 -fa 默认 true)。
}
